[package]
name = "rux-mobile-android"
description = "The Android shell: the cdylib NativeActivity loads, and the android_main symbol it calls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# `NativeActivity` loads `lib<name>.so` and calls `android_main` in it. The name is `rux_mobile`, and
# `android.app.lib_name` in `AndroidManifest.xml` is the other half of that agreement.
name = "rux_mobile"
crate-type = ["cdylib"]

[dependencies]
rux-mobile = { path = "../../app" }

[target.'cfg(target_os = "android")'.dependencies.winit]
version = "0.30.13"
default-features = false
features = ["android-native-activity"]
