[package]
name = "rux-mobile"
description = "The mobile application: rux components laid out for a phone. One crate, no platform code — each shell in mobile/ios, mobile/android and mobile/preview constructs it and hands it to the entry point its platform demands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# **An `rlib` and nothing else**, which is the whole point of this crate: it is the application, and the
# three shells are what turn it into a program.
#
# It used to be `["staticlib", "cdylib", "rlib"]`, and that does not work. Cargo builds **every** crate
# type in the list whenever the library is built, so an iOS build of `mobile/ios` — which wants a bin and
# an rlib — also tried to link `librux_mobile.dylib`, and a dylib for iOS is a link, and a link needs
# every framework resolved. The shells each declare the one crate type their platform loads:
# `mobile/android/glue` a `cdylib`, `mobile/ios` a `staticlib` beside its `bin`.
name = "rux_mobile"
crate-type = ["rlib"]

[dependencies]
rux.workspace = true
egui.workspace = true

# ------------------------------------------------------------------------------------------------
# `eframe` is declared per target rather than inherited from the workspace.
#
# Android needs `android-game-activity` where every other target needs nothing, and Cargo features are
# additive, so the Android feature has to be asked for on the Android target only. It used to be
# `android-native-activity`, which eframe refuses to combine with `accesskit`:
#
#     error: `accesskit` feature is only available with `android-game-activity`
#
# so the Android build had no screen reader. The shell is now a `GameActivity` (task-2189), and AccessKit is
# on everywhere.
# ------------------------------------------------------------------------------------------------

[target.'cfg(not(target_os = "android"))'.dependencies.eframe]
version = "0.36"
default-features = false
features = ["wgpu", "default_fonts", "accesskit"]

[target.'cfg(target_os = "android")'.dependencies.eframe]
version = "0.36"
default-features = false
features = ["wgpu", "default_fonts", "accesskit", "android-game-activity"]

# `winit` is named directly only for the one type `android_main` takes. The version has to be the one
# `eframe` depends on — cargo unifies them into a single crate, and a mismatch would mean two glue crates
# each claiming to be the application's entry point.
[target.'cfg(target_os = "android")'.dependencies.winit]
version = "0.30.13"
default-features = false
features = ["android-game-activity"]

[target.'cfg(target_os = "android")'.dependencies.rux-android]
workspace = true

[target.'cfg(target_os = "android")'.dependencies.android_logger]
version = "0.14"

[target.'cfg(target_os = "android")'.dependencies.log]
version = "0.4"
