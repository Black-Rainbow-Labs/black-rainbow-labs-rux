[package]
name = "rux-mobile-ios"
description = "The iOS shell: the bundle's executable, and a static library an existing Xcode project can link instead."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# The static library route: an Xcode project drags `librux_mobile.a` in and its own `main.m` calls
# `rux_mobile_main()`. `staticlib` is the one crate type that needs no linker at all to produce, which is
# why this builds on Windows with no Apple SDK anywhere.
name = "rux_mobile"
crate-type = ["staticlib"]
path = "src/lib.rs"

[[bin]]
# The bundle's own executable, which is what `build-ios.ps1` produces. The name is
# `Info.plist`'s `CFBundleExecutable` and the two have to agree.
name = "RuxMobile"
path = "src/main.rs"

[dependencies]
rux-mobile = { path = "../app" }
